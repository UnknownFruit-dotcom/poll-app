services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poll-app
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - default

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - default


  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: poll_app
      MYSQL_USER: laravel
      MYSQL_PASSWORD: Pswd-(19AA57
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: